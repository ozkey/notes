<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Notes</title>
    <style>
      :root {
        --bg: #f6f2e9;
        --surface: #fffdf8;
        --surface-alt: #fffcf7;
        --border: rgba(45, 90, 72, 0.2);
        --border-strong: rgba(45, 90, 72, 0.3);
        --text: #2d3a35;
        --text-muted: #56645e;
        --accent: #2d5a48;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", "Inter", "Roboto", Arial, sans-serif;
        line-height: 1.55;
        color: var(--text);
        background: linear-gradient(180deg, #faf7f1 0%, var(--bg) 100%);
        padding: 24px;
      }

      h1 {
        margin: 0 0 16px;
        color: #1f3f33;
        font-size: clamp(1.5rem, 2vw + 1rem, 2.15rem);
      }

      #indexList {
        background: var(--surface-alt);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px 16px;
        margin: 0 0 18px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
      }

      .index-list {
        margin: 0;
        padding-left: 18px;
        columns: 2;
        column-gap: 28px;
      }

      .index-list li {
        margin: 6px 0;
        break-inside: avoid;
      }

      .index-list a {
        color: var(--accent);
        border-bottom: 1px solid transparent;
      }

      #displayNotes {
        display: grid;
        gap: 14px;
      }

      article.note {
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        background: var(--surface);
        display: flow-root;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
      }

      article.note > h2 {
        margin: 0 0 10px;
        font-size: 1.1rem;
        color: #214637;
      }

      .note-content {
        color: var(--text);
      }

      .note-content p {
        margin: 0 0 0.9em;
      }

      .note-content h1,
      .note-content h2,
      .note-content h3,
      .note-content h4 {
        margin: 1em 0 0.5em;
        line-height: 1.3;
      }

      .note-content ul,
      .note-content ol {
        margin: 0 0 0.9em;
        padding-left: 1.5rem;
      }

      .note-content li {
        margin: 0.25em 0;
      }

      .note-content a {
        color: var(--accent);
      }

      .note-content pre {
        background: #1f2328;
        color: #e4e7eb;
        border-radius: 8px;
        padding: 12px;
        overflow-x: auto;
      }

      .note-content code {
        font-family: "Consolas", "Courier New", monospace;
      }

      .note-content table,
      .note-content .editor-table {
        width: 100%;
        border-collapse: collapse;
      }

      .note-content table td,
      .note-content table th,
      .note-content .editor-table td,
      .note-content .editor-table th {
        border: 1px solid #a3b2ab;
        padding: 7px;
        vertical-align: top;
      }

      .note-content blockquote {
        margin: 0.8em 0;
        padding: 10px 12px;
        border-left: 4px solid #2d5a48;
        background: #eef4f0;
        border-radius: 0 8px 8px 0;
      }

      .note-content blockquote.editor-alert-info {
        border-left-color: #0277bd;
        background: #e1f5fe;
      }

      .note-content blockquote.editor-alert-warning {
        border-left-color: #ef6c00;
        background: #fff3e0;
      }

      .note-content blockquote.editor-alert-error {
        border-left-color: #c62828;
        background: #ffebee;
      }

      .note-content .editor-highlight-badge {
        display: inline-block;
        background-color: #c8e6c9;
        border: 1px solid #88a88f;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.85em;
        line-height: 1.2;
        padding: 0.15em 0.55em;
        margin-right: 0.35em;
        color: #1e372d;
        vertical-align: baseline;
      }

      .note-content .editor-highlight-badge[data-color="blue"] {
        background-color: #bbdefb;
        border-color: #87abc8;
      }

      .note-content .editor-highlight-badge[data-color="pink"] {
        background-color: #f8bbd0;
        border-color: #c98ea2;
      }

      .note-content .editor-highlight-badge[data-color="red"] {
        background-color: #ffcdd2;
        border-color: #d39aa1;
      }

      .note-content .editor-highlight-badge[data-color="orange"] {
        background-color: #ffe0b2;
        border-color: #d7b388;
      }

      .note-content .editor-highlight-badge[data-color="purple"] {
        background-color: #e1bee7;
        border-color: #b996c0;
      }

      .note-content .editor-highlight-badge[data-color="white"] {
        background-color: #ffffff;
        border-color: #d7d7d7;
      }

      @media (max-width: 900px) {
        body {
          padding: 14px;
        }

        .index-list {
          columns: 1;
        }
      }

      /* Editor styles - imported from Editor.css */
      .custom-editor {
  position: relative;
  width: 100%;
}

.editor-toolbar {
  border: 1px solid rgba(45, 90, 72, 0.18);
  border-radius: 10px;
  background: #f8f3e8;
  padding: 8px;
  margin-bottom: 8px;
}

.editor-toolbar-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}

.editor-toolbar-row:last-child {
  margin-bottom: 0;
}

.editor-toolbar-btn,
.editor-toolbar-select {
  min-height: 36px;
  border: 1px solid rgba(45, 90, 72, 0.28);
  border-radius: 6px;
  background: #fffefb;
  padding: 6px 10px;
  font-size: 14px;
}

.editor-toolbar-btn {
  cursor: pointer;
}

.editor-file-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
}

.editor-file-btn input {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
}

.editor-content {
  height: 50vh;
  border: 1px solid rgba(45, 90, 72, 0.2);
  border-radius: 10px;
  padding: 12px;
  background: #fffefb;
  overflow-y: auto;
  overflow-x: auto;
}

.editor-content:focus {
  outline: 2px solid #2d5a48;
  outline-offset: 1px;
}

.editor-source {
  width: 100%;
  height: 50vh;
  border: 1px solid rgba(45, 90, 72, 0.2);
  border-radius: 10px;
  padding: 12px;
  font-family: "Consolas", "Courier New", monospace;
  font-size: 13px;
  overflow-y: auto;
  resize: vertical;
}

.editor-menu {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  border: 1px solid rgba(45, 90, 72, 0.16);
  border-radius: 10px;
  background: #fffcf8;
  padding: 8px;
  margin-bottom: 8px;
}

.editor-menu button,
.editor-floating-menu button,
.editor-modal button {
  border: 1px solid rgba(45, 90, 72, 0.25);
  border-radius: 6px;
  background: #fffefc;
  padding: 6px 10px;
  cursor: pointer;
}

.editor-image {
  max-width: 100%;
  height: auto;
  resize: both;
  overflow: auto;
  display: block;
  margin: 8px 0;
}

.editor-table {
  border-collapse: collapse;
  width: 100%;
  table-layout: fixed;
}

.editor-table td,
.editor-table th {
  border: 1px solid #9e9e9e;
  min-width: 80px;
  padding: 6px;
  resize: horizontal;
  overflow: auto;
}

.editor-content pre {
  background: #1e1e1e;
  color: #d4d4d4;
  border-radius: 6px;
  padding: 10px;
  overflow-x: auto;
}

.editor-content ul,
.editor-content ol {
  margin: 0 0 1em 0;
  padding-left: 2rem;
}

.editor-content li {
  margin: 0.25em 0;
}

blockquote {
  border-left: 4px solid #2d5a48;
  padding: 8px 12px;
  margin: 8px 0;
  background: #eef4f0;
}

blockquote.editor-alert-info {
  border-left-color: #0277bd;
  background: #e1f5fe;
}

blockquote.editor-alert-warning {
  border-left-color: #ef6c00;
  background: #fff3e0;
}

blockquote.editor-alert-error {
  border-left-color: #c62828;
  background: #ffebee;
}

.editor-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2147483646;
}

.editor-modal {
  width: min(420px, 92vw);
  border-radius: 8px;
  background: #fff;
  padding: 14px;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
}

.editor-modal h3 {
  margin: 0 0 10px 0;
}

.editor-modal input,
.editor-modal select {
  width: 100%;
  min-height: 36px;
  border: 1px solid #90a4ae;
  border-radius: 6px;
  padding: 6px 10px;
  margin-bottom: 10px;
}

.editor-inline-label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
}

.editor-inline-checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.editor-inline-checkbox input {
  width: auto;
  margin: 0;
}

.editor-modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

.editor-floating-menu {
  position: fixed;
  z-index: 30;
  display: flex;
  gap: 8px;
  border: 1px solid rgba(45, 90, 72, 0.2);
  border-radius: 10px;
  background: #fffefb;
  padding: 8px;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
}

.editor-image-resize-overlay {
  position: fixed;
  z-index: 21;
  border: 2px solid #2d5a48;
  pointer-events: none;
  box-sizing: border-box;
}

.editor-image-resize-handle {
  position: absolute;
  right: -8px;
  bottom: -8px;
  width: 16px;
  height: 16px;
  border: 1px solid #1a3a2e;
  background: #2d5a48;
  cursor: nwse-resize;
  pointer-events: auto;
}

@media (max-width: 1024px) {
  .editor-toolbar-btn,
  .editor-toolbar-select {
    min-height: 40px;
  }

  .editor-content,
  .editor-source {
    height: 25vh;
  }
}

.editor-highlight-badge {
  background-color: #c8e6c9;
  padding: 1px 4px;
  border-radius: 4px;
  font-weight: bold;
  border: 1px solid #999;
  margin-right: 4px;
  user-select: none;
  cursor: default;
  font-size: 1em;
}

.editor-highlight-badge[data-color="blue"] {
  background-color: #bbdefb;
}

.editor-highlight-badge[data-color="pink"] {
  background-color: #f8bbd0;
}

.editor-highlight-badge[data-color="red"] {
  background-color: #ffcdd2;
}

.editor-highlight-badge[data-color="orange"] {
  background-color: #ffe0b2;
}

.editor-highlight-badge[data-color="purple"] {
  background-color: #e1bee7;
}

.editor-highlight-badge[data-color="white"] {
  background-color: #ffffff;
  border: 1px solid #ddd;
}

.editor-tag-breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  margin-top: 8px;
  background: #faf7ef;
  border: 1px solid rgba(45, 90, 72, 0.14);
  border-radius: 6px;
  font-size: 12px;
  color: #616161;
  font-family: "Consolas", "Courier New", monospace;
  user-select: none;
}

.editor-tag-name {
  padding: 2px 6px;
  background: #fff;
  border: 1px solid rgba(45, 90, 72, 0.2);
  border-radius: 3px;
  font-weight: 500;
  color: #2d5a48;
}

.editor-tag-separator {
  color: #999;
  font-weight: 600;
}

    </style>

        // Script to append each saved note/article into the #displayNotes container.
       function addNotesToDisplay() {
        const container = document.getElementById("displayNotes");
        const indexContainer = document.getElementById("indexList");
        if (!container) {
          console.warn('No element with id "displayNotes" found.');
          return;
        }

        // Clear any existing content
        container.innerHTML = "";

        // Prepare index if available
        let indexListEl = null;
        if (indexContainer) {
          indexContainer.innerHTML = "";
          indexListEl = document.createElement("ul");
          indexListEl.className = "index-list";
        }

         if (!data) {
           console.warn("No data found.");
           return;
         }

         const noteEntries = Array.isArray(data.notes) ? data.notes : [];
         const articleEntries = Array.isArray(data.articles) ? data.articles : [];
         const combined = [
           ...noteEntries.map((note) => ({ type: "note", value: note })),
           ...articleEntries.map((article) => ({ type: "article", value: article })),
         ];

        combined.forEach((entry, index) => {
          try {
            const article = document.createElement("article");
            article.className = "note";
            article.dataset.index = index;

            const articleId =
              entry.type === "article"
                ? String(entry.value.id || "Unknown ID").replace(/^#/, "")
                : `${entry.value.book || "Unknown Book"}:${
                    entry.value.chapterNumber !== undefined &&
                    entry.value.chapterNumber !== null
                      ? entry.value.chapterNumber
                      : "Unknown Chapter"
                  }`;
            article.id = articleId;

            const heading = document.createElement("h2");
            if (entry.type === "article") {
              heading.textContent = `Article ${articleId}`;
            } else {
              const book = entry.value.book || "Unknown Book";
              const chapter =
                entry.value.chapterNumber !== undefined &&
                entry.value.chapterNumber !== null
                  ? entry.value.chapterNumber
                  : "Unknown Chapter";
              heading.textContent = `${book} ${chapter}`;
            }
            article.appendChild(heading);

            const content = document.createElement("div");
            content.className = "note-content";

            content.innerHTML = entry.value.text || "";
            article.appendChild(content);

            container.appendChild(article);

            // Add to index list if present
            if (indexListEl) {
              const li = document.createElement("li");
              const a = document.createElement("a");
              a.href = `#${encodeURIComponent(article.id)}`;
              if (entry.type === "article") {
                a.textContent = `Article ${articleId}`;
                a.setAttribute("aria-label", `Go to Article ${articleId}`);
              } else {
                const book = entry.value.book || "Unknown Book";
                const chapter =
                  entry.value.chapterNumber !== undefined &&
                  entry.value.chapterNumber !== null
                    ? entry.value.chapterNumber
                    : "Unknown Chapter";
                a.textContent = `${book} ${chapter}`;
                a.setAttribute("aria-label", `Go to ${book} ${chapter}`);
              }
              li.appendChild(a);
              indexListEl.appendChild(li);
            }
          } catch (err) {
            console.error("Failed to render note at index", index, err);
          }
        });

        if (indexListEl && indexContainer) {
          indexContainer.appendChild(indexListEl);
        }
      }

      // Populate when DOM is ready
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", addNotesToDisplay);
      } else {
        addNotesToDisplay();
      }
